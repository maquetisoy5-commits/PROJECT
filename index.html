<!-- FIXED INSANE LOADER -->
<div id="loader">

  <div class="bg-lines"></div>

  <h1 class="logo">WELCOME</h1>

  <div class="percent" id="percent">0%</div>

  <div class="bar-box">
    <div class="bar" id="bar"></div>
  </div>

  <p class="loading-text">Initializing Portfolio...</p>

</div>

<style>
#loader{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100vh;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:99999;
  overflow:hidden;
}

/* GRID */
.bg-lines{
  position:absolute;
  width:200%;
  height:200%;
  background:
  linear-gradient(#00ffee15 1px, transparent 1px),
  linear-gradient(90deg,#00ffee15 1px, transparent 1px);
  background-size:45px 45px;
  transform:rotate(45deg);
  animation:gridMove 6s linear infinite;
}

@keyframes gridMove{
  from{transform:rotate(45deg) translateY(0);}
  to{transform:rotate(45deg) translateY(45px);}
}

.logo{
  font-size:55px;
  color:#00ffee;
  text-shadow:0 0 20px #00ffee;
  letter-spacing:8px;
  z-index:2;
}

.percent{
  font-size:42px;
  color:white;
  margin-top:20px;
  z-index:2;
}

.bar-box{
  width:280px;
  height:8px;
  background:#111;
  border-radius:20px;
  overflow:hidden;
  margin-top:20px;
  z-index:2;
}

.bar{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,#00ffee,#00ff88);
  box-shadow:0 0 20px #00ffee;
}

.loading-text{
  color:#777;
  margin-top:15px;
  font-size:13px;
  letter-spacing:3px;
  z-index:2;
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function(){

let count = 0;
let percent = document.getElementById("percent");
let bar = document.getElementById("bar");
let loader = document.getElementById("loader");

let loading = setInterval(function(){

  count++;
  percent.innerHTML = count + "%";
  bar.style.width = count + "%";

  if(count >= 100){

    clearInterval(loading);

    loader.style.transition = "1.5s";
    loader.style.opacity = "0";

    setTimeout(function(){
      loader.style.display = "none";
      document.body.style.overflow = "auto";
    },1500);

  }

},30);

});
</script>
